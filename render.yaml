# Render Blueprint — https://render.com/docs/blueprint-spec
# Games live in server memory, so keep this to ONE instance (don't scale out).
services:
  - type: web
    name: take-your-stand
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
